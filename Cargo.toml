[workspace]
members = ["crates/noteka-core", "crates/noteka-cli", "crates/noteka-pdf-protocol", "crates/noteka-pdf-worker", "crates/noteka-mcp", "crates/noteka-parser-runtime", "crates/noteka-xlsx-protocol", "crates/noteka-xlsx-worker", "crates/noteka-ocr-protocol", "crates/noteka-pdfkit-protocol", "crates/noteka-pdfkit-runtime", "src-tauri"]
default-members = ["crates/noteka-core", "crates/noteka-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup", "hooks"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
