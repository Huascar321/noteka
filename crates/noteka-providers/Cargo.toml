[package]
name = "noteka-providers"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false

[[bin]]
name = "noteka-auth"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
uuid = { workspace = true }
chrono = { workspace = true }
dirs = "6"
ureq = { version = "3.5", features = ["json"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
keyring = "4.2"
noteka-workspace-hack = { version = "0.1", path = "../noteka-workspace-hack" }
