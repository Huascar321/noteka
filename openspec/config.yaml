rules:
  proposal:
    - State concrete scope, non-goals, and the durable capabilities changed.
    - Distinguish user decisions, proposed implementation choices, and unresolved external dependencies.
  specs:
    - Use observable SHALL or MUST requirements and at least one WHEN/THEN scenario per requirement.
    - Include relevant offline, invalid-input, concurrency and data-preservation cases.
    - Specify only the behavior implemented by this change, not the entire roadmap.
  design:
    - Explain ownership of data, core operations, migration strategy and alternatives.
    - Record decisions and bounded open questions; do not silently assume provider access.
  tasks:
    - Use unchecked numbered tasks, with explicit validation and traceability to capabilities.
    - Separate executable scope from future work; never mark planning as implementation.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
