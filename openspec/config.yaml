schema: spec-driven

context: |
  Language: Spanish
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Noteka is a greenfield personal local-first knowledge and productivity desktop app.
  Read docs/plan-noteka.md for the self-contained product vision and phased roadmap.
  Approved stack: Tauri 2, Svelte 5, TypeScript, Rust, SQLite; Tiptap/ProseMirror later.
  Rust owns domain rules; desktop, CLI first and MCP later use the same operations.
  SQLite and attachment originals are authoritative; indexes and AI outputs are rebuildable.
  PARA/Ultimate Brain essentials: notes, tasks, projects, typed tags, people and archive.
  LLMs and embedding providers are independently configurable; Jina v5 Text Small is preferred.
  Qwen3.5-4B plus LoRA is optional research, never a prerequisite for the product.
  Google Sheets is preview-only with browser opening; Google Photos is excluded.
  Offline core must work without accounts, models or external servers.
  Cloud models, Google integrations and initial model downloads require network access.
  Phase 0 has Rust/SQLite, CLI and Tauri/Svelte implementation; see docs/verification-phase-0.md.
  bootstrap-local-core is archived; main specs describe verified local behavior.
  add-block-editor is archived with semantic documents v2 and managed originals; see verification-phase-1.md.
  add-productivity-workflows is archived; see verification-phase-2.md.
  add-local-text-search is archived: only FTS/provenance from phase 5a, not extraction/embeddings/AI.
  add-database-engine is archived for phase 3a; see verification-phase-3a.md.
  add-formulas-and-rollups is archived for phase 3b; see verification-phase-3b.md.
  Phase 3c is split: advanced collection views first, templates/embedded collections next.
  add-advanced-collection-views is verified, synced and archived; 7/7 tasks and 117 native offline checks are complete.
  Current verified and archived SQLite source is v13/API v1/53 operations with explicit XLSX extraction, reading and field indexing/search. Only named index/search DTOs and capability metadata evolve; preserve the other 50 contracts and nine batchable mutations. Exact historic v11 contract comparison is no longer repeatable, as authorized below. Attachment indexing's historical v10/51 closure was verified 19/19, all three deltas synced/compared and archived as 2026-10-14-add-local-attachment-search. Document v3 references, templates and read-only embedded views remain verified. Extraction txt/md and bounded PDF are verified, synced and archived independently of Home; PDF retains a separate reader/helper.
  add-collection-templates-and-embeds is verified, synced and archived: 17/17 tasks, 69 Rust tests, 8 adapter/queue tests and 166 native offline checks.
  add-local-home-dashboard is implemented but not archived, with 9/17 tasks fully verified; final code/design/scenario review is complete and eight native acceptance tasks remain open.
  add-local-mcp is historically verified 22/22, its two deltas synced/compared and archived as 2026-10-15-add-local-mcp: scoped Rust core admission and a separate stdio binary had 23/43/44 tools from 51 core operations and seven workspace/filesystem/binary exclusions. Its final7 checks passed 235 Rust tests per profile, 17 independent official SDK tests per profile, three raw/concurrent rounds per profile, PDF/concurrency regressions and 606 headless checks; modern 2026-07-28, legacy 2025-11-25 and auto are tested offline. After preserving failed baselines, exact public FTS5 auxiliary traversal keeps every posting/source/copy/statistic check, per-document bitsets and complete fallback; two unchanged attachment gates passed query p95 134.96-204.81 ms (<=300 ms), maximum lock p95 19.80 ms. No cap/target increase, partial validation or universal latency promise. See docs/verification-mcp.md and ADRs 0014/0015; do not recreate or resync the change. Its v10/API v1/51 is historical, superseded by the verified XLSX changes below; preserve prior CLI/UI behavior and Home 9/17. No personal client configuration, remote activation, models or screen access.
  Historical extraction v8 closure passed 142 Rust tests, 4 subscription CLI tests in debug/release, 13 adapter/queue/theme tests, 3 bridge/consent tests and 606 headless UI/keyboard/interleaving checks. Historical phase 4 evidence passed 115 Rust tests at SQLite v7/40 operations. Current PDF integration evidence is recorded separately below.
  It implements 15 local Home views, shared read projections, Today by due date without changing My Day, and light/dark themes without a persistence migration.
  extend-agent-operations is implemented, verified, synced and archived as 2026-10-13-extend-agent-operations with 22/22 tasks, independently of Home native acceptance.
  Phase 4 implemented changes.preview/apply, nine batchable mutations, explicit bindings, state/effect receipts and 16-step CLI subscription construction at SQLite v7/40 operations. Extraction keeps this whitelist, uses base hash namespace v2 (original control included, operational/derived content excluded), and retains complete snapshots/64 MiB. See docs/batches.md for current contract and docs/verification-phase-4.md for historical evidence.
  add-local-extraction-queue is implemented, verified, synced and archived as 2026-10-13-add-local-extraction-queue with 20/20 tasks: persistent paused-by-default jobs, explicit one-job worker and literal UTF-8 txt/md fragments, SQLite v8/48 operations. Its 16 requirements/51 scenarios are verified and three delta specs synced. See docs/extraction.md, docs/verification-extraction.md and ADR 0011. Broad PDF/Excel/OCR, attachment indexing, models and the rest of phase 5a remain pending; this recut does not satisfy all dependencies of 5b. Never sync/archive Home without native acceptance.
  add-local-pdf-text-extraction is implemented, verified, synced and archived as 2026-10-14-add-local-pdf-text-extraction, 21/21 tasks and 13 requirements/56 scenarios across three deltas: SQLite v9/API v1/49, additive migration 009, strict PDF reader and disposable sibling helper. Read its archived artifacts, docs/pdf-extraction.md, docs/verification-pdf-extraction.md and ADR 0012; do not recreate the proposal or return to the experimental-only baseline. No generic PDF, OCR/render, Excel, attachment indexing, UI, models or remote activation; preserve previous contracts, Home 9/17 and unresolved 5a/5b dependencies.
  PDF corpus has 235 synthetic MIT cases with independent golden, original revision/xref/framing audit, effective loading view, lossless codecs/predictors and real manifest/fragment CLI comparison. Fresh debug/release checks passed 177 Rust tests (5 intentional ignores), 235 parser cases, 235 real CLI cases, 12 containment cases and two v8 migration states per profile; fmt/check/Clippy and contracts passed. Local release benchmark has 98 admitted cases plus saturation, five warmups/twenty samples each; maximum lock p95 20.19 ms after investigating a failed 180.54 ms baseline without increasing caps.
  add-local-attachment-search is verified 19/19, synced and archived as 2026-10-14-add-local-attachment-search: additive SQLite v10/API v1/51, explicit FTS indexing/search of existing UTF-8/PDF generations, independent of note search/Home. Real v9 migration/rollback/admission, all 49 prior contracts and 15 added requirements/40 new functional scenarios are checked. Closure reconciles one inherited migration requirement and its five scenarios with the current version; focused offline debug/release migration tests and two real v8 CLI states per profile passed with unchanged production code. All three deltas match main specs, unrelated requirements and all five inherited scenario names are preserved. Fresh implementation regression passed 212 Rust tests per profile, PDF parser/CLI/containment, 20 concurrent attachment CLI rounds per profile and 606 headless checks without external requests. Task 6.1 passed two consecutive final benchmarks: query p95 214.20-231.07 ms on the fixed 8 MiB corpus (<=300 ms), maximum lock p95 17.66 ms (<=150 ms). Validated external probe includes copy/clone hooks and SHM, ten real CLI cases; physical scratch allocated-file peak 21,254,144 bytes, not logical TEMP pages or exclusive APFS usage. Exact within-snapshot tokenization reuse verifies every posting with an independent per-document bitset; without reuse it retains the complete sequence/set fallback. Borrowed sorted JSON preserves hash v1; aarch64 enables sha2 0.10.9 asm with runtime detection/portable fallback, adding only sha2-asm 0.6.4 to Cargo.lock. Sixteen pre-existing generations verify with the new backend. Failed baselines remain documented; no target/cap increase, partial validation or performance exception. Corpus-specific result, not a universal 300 ms guarantee. Read archived tasks, docs/verification-attachment-search.md and ADR 0013; do not recreate or resync the change. Home remains 9/17 untouched; this does not complete all 5a or 5b dependencies.
  Rust/PDF/CLI and host no-bundle build used denied network. Headless bridge needs loopback HTTP while CLI subprocesses remain denied network; final UI run passed all 606 checks without personal profile, external requests or desktop windows. Earlier failed runs remain recorded, no assertions changed. Do not mistake no-bundle or CLI bridge checks for native IPC/focus/close acceptance. UI/host Rust and migrations 001-009 remain unchanged except additive generated contracts/configuration.
