  add-local-xlsx-extraction was archived as 2026-10-15-add-local-xlsx-extraction after exact four-delta comparison and 11/11 tasks. Do not recreate or resync it. Its archived product baseline was v11/API v1/52, now superseded by v12; Home remains active, 9/17 and unsynced/unarchived pending specifically authorized native acceptance.
  add-local-xlsx-search is verified 19/19, its five deltas/14 requirements/49 scenarios synced and compared exactly, with 32 inherited scenarios and 75 unaffected requirements preserved; archived as 2026-10-16-add-local-xlsx-search. Current product is v12 barrier and xlsx_cell_fields_v1 projection/index/search, API v1/52, MCP 24/44/45, nine batch mutations. Fresh 2026-10-16 regression passed 287 Rust tests per profile, XLSX/PDF oracles/processes, 21 SDK per profile, three raw rounds and 606 headless checks; host no-bundle build passed offline without a window. Two consecutive mixed gates passed query p95 167.02-270.74 ms and two unchanged UTF-8/PDF gates 114.31-152.19 ms, maximum lock p95 28.208 ms, physical scratch observed 22298624 B across ten CLI cases. Preserve full validation/current caps/300 ms target. Above 256 terms, bounded public FTS5 phrase traversal checks every instance and retains complete typed-stream fallback; no trust cache/persisted schema change. See docs/verification-xlsx-search.md, docs/xlsx-search.md and ADR 0018. Only named index/search definitions and capability metadata evolve; historic exact comparison with v11 is not newly proven. Do not recreate or resync the change, change Home, install models, activate remotes or access the native screen.
