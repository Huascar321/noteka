  add-local-evidence-search-ui is verified 17/17, its sole local-text-search delta synced/compared and archived as 2026-10-16-add-local-evidence-search-ui; 13 unaffected requirements and inherited note scenario preserved. Search has separate notes/entities and attachment scopes, read-only extraction.search, a replacement page of 20 hits and full canonical text/provenance/coverage; no preparation, readers or base64 downloads. Headless acceptance passed 1248 new checks plus unchanged 606 inherited checks, no external requests or desktop screen. Fresh regression passed 287 Rust tests per profile, 21 SDK tests per profile and three raw rounds; four final unchanged gates passed mixed query p95 169.49-235.47 ms and UTF-8/PDF 121.37-182.71 ms, maximum lock p95 18.94 ms. Initial 306.40 ms failed gate is preserved with investigation and unproven cause, not excepted; no core/cap/target/validation changes or optimization claim. See docs/evidence-search-ui.md and docs/verification-evidence-search-ui.md. Product remains v12/API v1/52, MCP 24/44/45, nine batch mutations, no dependencies/migrations/core/Home changes. Baseline pre-UI v12 and eight binary copies are durable outside Git; they do not recover historical v11 evidence. Do not recreate/resync this change; leave Home active 9/17 untouched. Phase 5a/5b, native acceptance, models and remotes are not complete.

  Continuación verificada del 17/10: preparación UI 9/9, lector de generaciones 6/6 y consulta agrupada 6/6, con deltas sincronizados/contrastados y cambios archivados el 17/10. Ver docs/verification-local-preparation-closure.md: 3116 checks headless de producto, 75 cliente/editor, 11 puente/lotes, 287 Rust por perfil, 36 etapas compartidas y cuatro gates frescos sin cambiar cuotas/targets/validación. Los 151 protegidos y catálogos completos v12/API v1/52 permanecen idénticos. Preparar/leer/buscar son acciones distintas; no hay writes al abrir o buscar. Sólo estos tres deltas terminados se sincronizaron/archivaron; Home sigue 9/17 intacto. OCR/ampliaciones PDF/Excel y 5a/5b no están completos. La meta ampliada es continuar por dependencias hasta fase 6 inclusive y detenerse con informe acumulado; no iniciar 7/8. La instrucción vigente prohíbe instalar modelos, activar proveedores/pagos/OAuth/publicación, reutilizar sesiones internas y usar pantalla sin autorización específica. Implementar/verificar lo independiente y reportar intervención real necesaria sin atribuir inferencia/acceso reales a mocks.

